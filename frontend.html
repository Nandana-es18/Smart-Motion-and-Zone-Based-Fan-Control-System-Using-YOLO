<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Fan Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        body {
            background-color: #f0f4f8;
            color: #333;
            font-family: Arial, sans-serif;
        }
        .header {
            background: linear-gradient(90deg, #228afa, #00c6ff);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .zone-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .zone-card:hover {
            transform: translateY(-5px);
        }
        .active-zone {
            background-color: #2abe1a;
            color: white;
        }
        .inactive-zone {
            background-color: #ff4d4d;
            color: white;
        }
        .fan-on {
            color: #ffc107;
        }
        .switch-container span {
            font-weight: bold;
        }
        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .manual-on {
            background-color: #000000 !important;
        }
        .auto-on {
            background-color: #ffffff !important;
        }
        .video-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .video-box {
            border: 3px solid #1e2022;
            border-radius: 12px;
            overflow: hidden;
            display: inline-block;
            width: 400px;
            height: 300px;
            position: relative;
        }
        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fullscreen-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .camera-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">Smart Fan Zone-Based Control System
    </div>
    
    <div class="container mt-4">
        <div class="video-container">
            <div class="video-box" id="videoBox">
                <img id="videoFeed" src="video_feed_url_here" alt="Live Video Feed" />
                <span class="camera-icon">📷</span>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶</button>
            </div>
        </div>

        <div class="text-center mb-3">
            <button class="btn btn-primary" onclick="ZoneStatus()"> Zone Status</button>
        </div>

        <div id="zoneStatus" style="display: none;">
            <div class="row" id="zoneContainer"></div>
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            const videoBox = document.getElementById('videoBox');
            if (!document.fullscreenElement) {
                videoBox.requestFullscreen().catch((err) => console.error(err));
            } else {
                document.exitFullscreen();
            }
        }

        function ZoneStatus() {
            const zoneStatus = document.getElementById('zoneStatus');
            zoneStatus.style.display = zoneStatus.style.display === 'none' ? 'block' : 'none';
        }

        function createZone(zoneNumber) {
            return `
                <div class='col-md-3'>
                    <div id='zone${zoneNumber}' class='zone-card inactive-zone'>
                        <h5>Zone ${zoneNumber}</h5>
                        <p>Status: <span id='occupancy${zoneNumber}'>Inactive</span></p>

                        <div class='switch-row'>
                            <span>Auto</span>
                            <label class='form-check form-switch'>
                                <input class='form-check-input auto-on' type='checkbox' id='fanSwitch${zoneNumber}' onclick='toggleFan(${zoneNumber})'>
                            </label>
                            <span>Manual</span>
                        </div>

                        <div id='manualOptions${zoneNumber}' style='display: none;'>
                            <div class='switch-row'>
                                <span>Fan OFF</span>
                                <label class='form-check form-switch'>
                                    <input class='form-check-input' type='checkbox' id='manualFanSwitch${zoneNumber}' onclick='manualFanControl(${zoneNumber})'>
                                </label>
                                <span>Fan ON</span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function toggleFan(zoneNumber) {
            const switchButton = document.getElementById(`fanSwitch${zoneNumber}`);
            const manualOptions = document.getElementById(`manualOptions${zoneNumber}`);
            const isManual = switchButton.checked;

            switchButton.classList.toggle('manual-on', isManual);
            switchButton.classList.toggle('auto-on', !isManual);

            if (isManual) {
                manualOptions.style.display = 'block';
            } else {
                manualOptions.style.display = 'none';
                console.log(`Zone ${zoneNumber} in Auto Mode.`);
            }
        }

        function manualFanControl(zoneNumber) {
            const manualSwitch = document.getElementById(`manualFanSwitch${zoneNumber}`);
            console.log(`Fan in Zone ${zoneNumber} is now ${manualSwitch.checked ? 'ON' : 'OFF'}`);
        }

        const zoneContainer = document.getElementById('zoneContainer');
        for (let i = 1; i <= 4; i++) {
            zoneContainer.innerHTML += createZone(i);
        }
    </script>
</body>
</html>
